version: '3.8'

services:
  aicra:
    build: .
    container_name: aicra-app
    # Security: Bind to localhost only to prevent external access
    # For production, front with authenticated reverse proxy (nginx/traefik)
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # Local file-store tracking (no network server required)
      - MLFLOW_TRACKING_URI=file:/app/mlruns
    command: ["python", "-m", "aicra", "--help"]
    healthcheck:
      test: ["CMD", "python", "-c", "import aicra; print('AICRA is healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: start only when needed — `docker compose --profile mlflow up mlflow`
  mlflow:
    profiles: ["mlflow"]
    image: python:3.10-slim
    container_name: aicra-mlflow
    # Security: localhost-only host bind; stock MLflow has no auth.
    # Do not expose publicly without a reverse proxy (TLS + authentication).
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlruns:/mlruns
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlruns/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlruns
    command:
      - "mlflow"
      - "server"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
