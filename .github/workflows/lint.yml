name: Python Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt || pip install -r requirements.txt
      - name: Run ruff check
        run: |
          ruff check aicra/ experiments/ scripts/ || (echo "Ruff found issues" && exit 1)
          echo "Ruff check passed"
      - name: Run ruff format check
        run: |
          ruff format --check aicra/ experiments/ scripts/ || (echo "Ruff format check failed" && exit 1)
          echo "Ruff format check passed"