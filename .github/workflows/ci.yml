name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  guardrails:
    name: Repo Hygiene & Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps (if needed)
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "No requirements file found; continuing without dependency install."
          fi

      - name: Run guardrails check
        run: |
          python scripts/ci_guardrails.py

      - name: Check for unsafe pickle patterns
        run: |
          echo "Checking for unsafe pickle patterns..."
          if grep -R "allow_pickle=True" --include="*.py" aicra/ tests/ scripts/ 2>/dev/null; then
            echo "❌ Found unsafe allow_pickle=True patterns"
            exit 1
          fi

          # Warn-only for pickle.load unless explicitly marked safe/internal/test in the same line.
          if grep -R "pickle\.load(" --include="*.py" aicra/ tests/ scripts/ 2>/dev/null \
            | grep -Ev "#.*(safe|internal|test)"; then
            echo "⚠️  Found pickle.load() usage - review for safety (warn only)"
          fi

          echo "✅ Pickle pattern check passed"

      - name: Check Docker security
        run: |
          echo "Checking Docker configuration..."
          if [ -f docker-compose.yml ]; then
            if grep -q "0.0.0.0" docker-compose.yml && ! grep -Eq "127\.0\.0\.1|localhost" docker-compose.yml; then
              echo "⚠️  Warning: Docker compose exposes 0.0.0.0 without localhost binding"
              echo "   Ensure ports are bound to 127.0.0.1 to prevent external access"
            fi
          fi
          echo "✅ Docker security check passed"

      - name: Check for secrets (basic patterns)
        run: |
          echo "Checking for accidentally committed secrets..."
          FOUND_SECRETS=0

          # Basic patterns (for production use gitleaks/trufflehog)
          if git grep -nE "AKIA[0-9A-Z]{16}" -- ':!*.md' ':!*.txt' ':!scripts/ci_guardrails.py' 2>/dev/null; then
            echo "⚠️  Potential AWS Access Key detected"
            FOUND_SECRETS=1
          fi
          if git grep -nE "sk_live_[0-9a-zA-Z]{32}" -- ':!*.md' ':!*.txt' ':!scripts/ci_guardrails.py' 2>/dev/null; then
            echo "⚠️  Potential Stripe live key detected"
            FOUND_SECRETS=1
          fi
          if git grep -nE "AIza[0-9A-Za-z_-]{35}" -- ':!*.md' ':!*.txt' ':!scripts/ci_guardrails.py' 2>/dev/null; then
            echo "⚠️  Potential Google API key detected"
            FOUND_SECRETS=1
          fi

          if [ "$FOUND_SECRETS" -eq 1 ]; then
            echo "⚠️  Potential secrets detected - review manually."
            # warn only
          else
            echo "✅ No obvious secret patterns detected"
          fi

  python-quality:
    name: Python Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "No requirements file found; installing minimal tooling."
            pip install pytest ruff
          fi

      - name: Compile Python files
        run: |
          python -m compileall aicra/ experiments/ scripts/

      - name: Run ruff (no auto-fix in CI)
        run: |
          ruff check aicra/ experiments/ scripts/

      - name: Run pytest (if tests exist)
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            pytest tests/ --tb=short -v
          else
            echo "No tests found; skipping."
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          pip install ruff black isort pylint

      - name: Ruff
        run: ruff check aicra/ experiments/ scripts/ tests/

      - name: Black
        run: black --check aicra/ experiments/ scripts/ tests/

      - name: Isort
        run: isort --check-only aicra/ experiments/ scripts/ tests/

      - name: Pylint (non-blocking by default)
        run: |
          pylint aicra || echo "⚠️ pylint reported issues (warn-only)"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install typecheck tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          pip install mypy

      - name: Run mypy (fail only if you want strict gating)
        run: |
          mypy aicra || echo "⚠️ mypy reported issues (warn-only)"

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install pytest pytest-cov
          fi

      - name: Run tests (skip real-data tests by default)
        env:
          AICRA_RUN_REAL_DATA_TESTS: "0"
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            pytest tests/ --cov=aicra --cov-report=xml --cov-report=html
          else
            echo "No tests found; skipping."
          fi

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Lint & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          pip install bandit pip-audit safety

      - name: Bandit security scan (warn-only)
        run: |
          bandit -r aicra/ experiments/ scripts/ -f json -o bandit-report.json || true

      - name: pip-audit (conditional)
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            pip-audit --desc --format=json --output=pip-audit-report.json || true
          else
            echo "No dependency manifest found; skipping pip-audit"
          fi

      - name: Safety (warn-only)
        run: |
          safety check --json --output safety-report.json || true

      - name: Check for unsafe pickle patterns (security)
        run: |
          echo "Security: Checking for unsafe pickle usage..."
          if grep -R "allow_pickle=True" --include="*.py" aicra/ tests/ scripts/ 2>/dev/null; then
            echo "❌ SECURITY: Unsafe allow_pickle=True found"
            exit 1
          fi
          echo "✅ No unsafe allow_pickle patterns detected"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            safety-report.json
          if-no-files-found: ignore

  sonar:
    name: sonar
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Better analysis; avoids shallow clone issues

      - name: Run SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Skip Sonar (token not set)
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: echo "Skipping Sonar: SONAR_TOKEN not set"

